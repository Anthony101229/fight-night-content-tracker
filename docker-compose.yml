services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fightnight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fightnight}
      POSTGRES_DB: ${POSTGRES_DB:-fightnight}
    ports:
      # Host port 5433 so it doesn't clash with a Postgres already running on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the service name "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fightnight}:${POSTGRES_PASSWORD:-fightnight}@db:5432/${POSTGRES_DB:-fightnight}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Mount the code so edits on your machine reload the server without rebuilding.
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # The "web" (React) service is added in Phase 4.

volumes:
  pgdata:
