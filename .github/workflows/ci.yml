name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres for the tests, same version as docker-compose.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fightnight
          POSTGRES_PASSWORD: fightnight
          POSTGRES_DB: fightnight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fightnight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests create and migrate "fightnight_test" on this server automatically.
      DATABASE_URL: postgresql+psycopg://fightnight:fightnight@localhost:5432/fightnight

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api and web images
        run: docker compose build
